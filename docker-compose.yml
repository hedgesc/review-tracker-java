services:
  mysql:
    image: mysql:8.4
    container_name: reviewtracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ReviewTracker
      MYSQL_USER: reviewtracker
      MYSQL_PASSWORD: reviewtracker
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - reviewtracker-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: reviewtracker-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ReviewTracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: reviewtracker
      SPRING_DATASOURCE_PASSWORD: reviewtracker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - bin/
            - obj/

  frontend:
    build:
      context: ./frontend
    container_name: reviewtracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    develop:
      watch:
        # Frontend image is nginx serving a Vite production build, so source
        # changes must rebuild the image (syncing into /app/src has no effect).
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

volumes:
  reviewtracker-mysql-data:
